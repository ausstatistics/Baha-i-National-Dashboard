        function createTable(data, title) {
            if (!data || data.length === 0) return `<div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 text-center text-gray-500">No data available for this selection.</div>`;
            
            const headers = Object.keys(data[0]);
            const headerHtml = headers.map(h => `<th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider bg-gray-50 sticky top-0 whitespace-nowrap">${h.replace(/_/g, ' ')}</th>`).join('');
            
            const bodyHtml = data.map((row, idx) => 
                `<tr class="${idx % 2 === 0 ? 'bg-white' : 'bg-gray-50'} hover:bg-sky-50 transition-colors duration-150">
                    ${headers.map(h => {
                        const cellValue = row[h];
                        const formattedValue = (typeof cellValue === 'number') 
                            ? cellValue.toLocaleString('en-US')
                            : (row[h] === undefined ? '' : row[h]);
                        return `<td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700 border-b border-gray-100">${formattedValue}</td>`;
                    }).join('')}
                </tr>`
            ).join('');

            return `
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden mb-6">
                    <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-white">
                        <h3 class="text-lg font-semibold text-gray-800">${title}</h3>
                    </div>
                    <div class="overflow-x-auto custom-scrollbar max-h-[500px]">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead><tr>${headerHtml}</tr></thead>
                            <tbody>${bodyHtml}</tbody>
                        </table>
                    </div>
                </div>`;
        }

        function createPivotedTable(data, title, activityKeys, filterRegion = 'All') {
            let filteredData = data;
            if(filterRegion !== 'All') {
                filteredData = data.filter(d => d.Region === filterRegion);
            }

            const regions = [...new Set(filteredData.map(item => item.Region))].filter(r => r !== 'South-Eastern Australia');
            const activities = activityKeys;
            
            const pivotData = regions.map(region => {
                const row = { Region: region };
                let all_no = 0, all_total = 0, all_fof = 0;
                activities.forEach(activity => {
                    const activityData = filteredData.find(d => d.Region === region && d.Category === activity);
                    const no = activityData ? (Number(activityData['Number of Activities']) || 0) : 0;
                    const total = activityData ? (Number(activityData['Total Participants']) || 0) : 0;
                    const fof = activityData ? (Number(activityData['Friends of the Faith']) || 0) : 0;
                    row[`${activity}_no`] = no; row[`${activity}_total`] = total; row[`${activity}_fof`] = fof;
                    all_no += no; all_total += total; all_fof += fof;
                });
                row['all_no'] = all_no; row['all_total'] = all_total; row['all_fof'] = all_fof;
                return row;
            });

            const bodyHtml = pivotData.map(row => `
                <tr class="hover:bg-sky-50 transition-colors duration-150 border-b border-gray-100">
                    <td class="px-4 py-3 whitespace-nowrap font-medium text-gray-800 border-r bg-white sticky left-0 z-10 shadow-sm">${row.Region}</td>
                    ${activities.map(act => `
                        <td class="px-2 py-2 text-center text-gray-600 border-r border-dashed border-gray-200">${row[`${act}_no`].toLocaleString()}</td>
                        <td class="px-2 py-2 text-center text-gray-600 border-r border-dashed border-gray-200">${row[`${act}_total`].toLocaleString()}</td>
                        <td class="px-2 py-2 text-center text-gray-600 border-r border-gray-300 bg-gray-50/50">${row[`${act}_fof`].toLocaleString()}</td>
                    `).join('')}
                    <td class="px-2 py-2 text-center font-bold text-sky-700 bg-sky-50 border-r border-white">${row.all_no.toLocaleString()}</td>
                    <td class="px-2 py-2 text-center font-bold text-sky-700 bg-sky-50 border-r border-white">${row.all_total.toLocaleString()}</td>
                    <td class="px-2 py-2 text-center font-bold text-sky-700 bg-sky-50">${row.all_fof.toLocaleString()}</td>
                </tr>`).join('');
                
            const activityHeaders = activities.map(act => `<th colspan="3" class="px-4 py-2 border-r border-gray-300 text-center bg-gray-100 text-gray-700 font-semibold text-xs uppercase">${act}</th>`).join('');
            const subHeaders = activities.map(() => `<th class="px-2 py-1 border-r border-gray-200 text-xs font-normal text-gray-500">No.</th><th class="px-2 py-1 border-r border-gray-200 text-xs font-normal text-gray-500">Part.</th><th class="px-2 py-1 border-r border-gray-300 text-xs font-normal text-gray-500 bg-gray-50">FoF</th>`).join('');

            return `<div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden mt-8">
                    <div class="px-6 py-4 border-b border-gray-100"><h3 class="text-lg font-semibold text-gray-800">${title}</h3></div>
                    <div class="overflow-x-auto custom-scrollbar">
                        <table class="min-w-full text-sm border-collapse">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th rowspan="2" class="px-4 py-3 border-r border-gray-300 text-left font-semibold text-gray-700 sticky left-0 z-20 bg-gray-100 shadow-sm text-xs uppercase">Region</th>
                                    ${activityHeaders}
                                    <th colspan="3" class="px-4 py-2 text-center bg-sky-100 text-sky-800 font-bold border-b border-sky-200 text-xs uppercase">Totals</th>
                                </tr>
                                <tr>
                                    ${subHeaders}
                                    <th class="px-2 py-1 text-xs font-semibold text-sky-700 bg-sky-50 border-r border-sky-100">Act.</th>
                                    <th class="px-2 py-1 text-xs font-semibold text-sky-700 bg-sky-50 border-r border-sky-100">Part.</th>
                                    <th class="px-2 py-1 text-xs font-semibold text-sky-700 bg-sky-50">FoF</th>
                                </tr>
                            </thead>
                            <tbody class="bg-white text-gray-700">${bodyHtml}</tbody>
                        </table>
                    </div>
                </div>`;
        }

        // --- 3. LOGIC FUNCTIONS (Defined as Functions for Hoisting) ---

        function renderTabs() {
            const tabNames = ['Main Dashboard', 'Cycle Data', 'Bi-Annual Survey', 'Cluster Development', 'Pioneering', 'Youth Movement'];
            const container = document.getElementById('tabs-container');
            if (container) {
                container.innerHTML = tabNames.map(name => {
                    const isActive = currentTab === name;
                    return `
                        <button data-tab-name="${name}" class="tab-button whitespace-nowrap px-4 py-2 rounded-md text-sm font-medium transition-all duration-200 focus:outline-none ${isActive ? 'bg-sky-100 text-sky-800 shadow-sm ring-1 ring-sky-200' : 'text-gray-600 hover:bg-gray-100 hover:text-gray-900'}">
                            ${name}
                        </button>
                    `;
                }).join('');
                
                document.querySelectorAll('.tab-button').forEach(button => 
                    button.addEventListener('click', () => renderContent(button.dataset.tabName))
                );
            }
        }

        function populateRegionFilter() {
            if (!regionSelect) return;
            // clear existing except first
            while (regionSelect.options.length > 1) { regionSelect.remove(1); }
            
            const sourceData = appData.regional.length > 0 ? appData.regional : initialData.regional;
            const regions = [...new Set(sourceData.map(item => item.Region))].sort();
            regions.forEach(region => {
                const option = document.createElement('option');
                option.value = region;
                option.textContent = region;
                regionSelect.appendChild(option);
            });
            
            // Clean event listener assignment
            regionSelect.onchange = (e) => {
                currentRegionFilter = e.target.value;
                renderContent(currentTab);
            };
        }

        function calculateTotals(regionFilter) {
            const totals = {};
            const activities = ["Devotional Meetings", "Children's Classes", "Junior Youth Groups", "Study Circles"];
            const sourceData = appData.regional.length > 0 ? appData.regional : initialData.regional;

            activities.forEach(activity => {
                const rowsForActivity = sourceData.filter(row => {
                    const matchesActivity = row.Category === activity;
                    const matchesRegion = regionFilter === 'All' || row.Region === regionFilter;
                    return matchesActivity && matchesRegion;
                });

                totals[activity] = {
                    "Activity": activity,
                    "Number of Activities": rowsForActivity.reduce((sum, row) => sum + (Number(row["Number of Activities"]) || 0), 0),
                    "Total Participants": rowsForActivity.reduce((sum, row) => sum + (Number(row["Total Participants"]) || 0), 0),
                    "Friends of the Faith": rowsForActivity.reduce((sum, row) => sum + (Number(row["Friends of the Faith"]) || 0), 0),
                };
            });
            
            return Object.values(totals);
        }

        function renderCharts() {
            Object.values(chartInstances).forEach(chart => chart.destroy());
            const COLORS = ['#0284c7', '#059669', '#d97706', '#dc2626', '#7c3aed', '#db2777']; 

            if (currentTab === 'Main Dashboard') {
                const regionalCtx = document.getElementById('regionalBarChart');
                const pieCtx = document.getElementById('participantPieChart');
                let displayData = appData.regional.length > 0 ? appData.regional : initialData.regional;
                
                if (regionalCtx) {
                    let labels, datasets;
                    if (currentRegionFilter === 'All') {
                         labels = [...new Set(displayData.map(item => item.Region))].filter(r => r !== 'South-Eastern Australia');
                         const activityTypes = [...new Set(displayData.map(item => item.Category))];
                         datasets = activityTypes.map((activity, index) => ({
                            label: activity,
                            data: labels.map(label => displayData.filter(d => d.Region === label && d.Category === activity).reduce((sum, row) => sum + (Number(row['Number of Activities']) || 0), 0)),
                            backgroundColor: COLORS[index % COLORS.length],
                            borderRadius: 4
                        }));
                    } else {
                        labels = ["Devotional Meetings", "Children's Classes", "Junior Youth Groups", "Study Circles"];
                        datasets = [{
                            label: currentRegionFilter,
                            data: labels.map(act => displayData.filter(d => d.Region === currentRegionFilter && d.Category === act).reduce((sum, row) => sum + (Number(row['Number of Activities']) || 0), 0)),
                            backgroundColor: [COLORS[0], COLORS[1], COLORS[2], COLORS[3]],
                            borderRadius: 6
                        }];
                    }
                    chartInstances.regionalBar = new Chart(regionalCtx, { 
                        type: 'bar', data: { labels, datasets }, 
                        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } }, scales: { x: { stacked: currentRegionFilter === 'All' }, y: { stacked: currentRegionFilter === 'All', beginAtZero: true } } } 
                    });
                }

                if (pieCtx) {
                    const currentStats = calculateTotals(currentRegionFilter);
                    const participantData = currentStats.map(d => ({ name: d.Activity, value: Number(d['Total Participants']) })).filter(d => !isNaN(d.value) && d.value > 0);
                    chartInstances.pie = new Chart(pieCtx, { 
                        type: 'doughnut', data: { labels: participantData.map(d => d.name), datasets: [{ data: participantData.map(d => d.value), backgroundColor: COLORS, borderWidth: 0, hoverOffset: 4 }] }, 
                        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } } 
                    });
                }
            } else if (currentTab === 'Youth Movement') {
                 const youthData = appData.youthMovement.total > 0 ? appData.youthMovement : initialData.youthMovement;
                 const ctx = document.getElementById('youthPolarChart');
                 if (ctx) {
                    chartInstances.youth = new Chart(ctx, {
                        type: 'polarArea',
                        data: {
                            labels: ['In Study Circles', 'Teaching Children', 'Animating JY', 'Tutoring SC'],
                            datasets: [{
                                data: [youthData.inStudyCircles, youthData.teachingChildrensClasses, youthData.animatingJuniorYouth, youthData.tutoringStudyCircle],
                                backgroundColor: ['rgba(124, 58, 237, 0.7)', 'rgba(245, 158, 11, 0.7)', 'rgba(219, 39, 119, 0.7)', 'rgba(220, 38, 38, 0.7)'],
                                borderWidth: 1
                            }]
                        },
                        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right' } } }
                    });
                 }
            } else if (currentTab === 'Bi-Annual Survey') {
                const surveyData = appData.survey.length > 0 ? appData.survey : initialData.survey;
                
                // Helper to sort dates chronologically (Mon-YY) for charts
                const dateValue = (d) => {
                    const [mon, yr] = d.split('-');
                    const months = { 'Jan': 0, 'Feb': 1, 'Mar': 2, 'Apr': 3, 'May': 4, 'Jun': 5, 'Jul': 6, 'Aug': 7, 'Sep': 8, 'Oct': 9, 'Nov': 10, 'Dec': 11 };
                    return (parseInt(yr) + 2000) * 12 + months[mon];
                };

                const labels = [...new Set(surveyData.map(d => d.Date))].sort((a, b) => dateValue(a) - dateValue(b));
                const activities = [...new Set(surveyData.map(d => d.Activity))];

                ['surveyGroupsChart', 'surveyParticipantsChart', 'surveyFofChart'].forEach((id, idx) => {
                    const ctx = document.getElementById(id);
                    if(!ctx) return;
                    const metric = idx === 0 ? 'Groups' : idx === 1 ? 'Participants' : 'FoF';
                    const datasets = activities.map((activity, i) => ({
                        label: activity,
                        data: labels.map(label => {
                            const p = surveyData.find(d => d.Date === label && d.Activity === activity);
                            return p ? p[metric] : null;
                        }),
                        borderColor: COLORS[i % COLORS.length],
                        tension: 0.3,
                        fill: false
                    }));
                    chartInstances[id] = new Chart(ctx, { type: 'line', data: { labels, datasets }, options: { maintainAspectRatio: false, plugins: {legend: {position: 'bottom'}}} });
                });
             } else if (currentTab === 'Pioneering') {
                const trendsData = appData.pioneeringTrends.length > 0 ? appData.pioneeringTrends : initialData.pioneeringTrends;
                
                // FIXED: Sort labels chronologically to prevent jumbled data
                // Logic: Sort by Year first. If years equal, "Nov-Apr" (0) comes before "May-Oct" (1)
                const labels = [...new Set(trendsData.map(d => d.Date))].sort((a, b) => {
                    const [rangeA, yearA] = a.split(' ');
                    const [rangeB, yearB] = b.split(' ');
                    const yA = parseInt(yearA) || 0;
                    const yB = parseInt(yearB) || 0;
                    
                    if (yA !== yB) return yA - yB;
                    
                    // Assign values: Nov-Apr = 0, May-Oct = 1
                    const valA = rangeA.startsWith('Nov') ? 0 : 1;
                    const valB = rangeB.startsWith('Nov') ? 0 : 1;
                    return valA - valB;
                });

                const drawPioneerChart = (id, type) => {
                     const ctx = document.getElementById(id);
                     if(!ctx) return;
                     chartInstances[id] = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: labels,
                            datasets: [
                                { label: 'Male', data: labels.map(d => trendsData.filter(x => x.Date === d).reduce((a,b) => a + (b[`${type} Male`]||0), 0)), backgroundColor: '#3b82f6' },
                                { label: 'Female', data: labels.map(d => trendsData.filter(x => x.Date === d).reduce((a,b) => a + (b[`${type} Female`]||0), 0)), backgroundColor: '#ec4899' }
                            ]
                        },
                        options: { maintainAspectRatio: false, scales: { x: { stacked: true }, y: { stacked: true } } }
                     });
                };
                
                 // Defer execution to ensure DOM is updated
                 setTimeout(() => {
                    drawPioneerChart('internationalPioneerTrendsChart', "Int'l");
                    drawPioneerChart('homefrontPioneerTrendsChart', "Homefront");
                 }, 0);

             } else if (currentTab === 'Cycle Data') {
                 const ctx = document.getElementById('cycleGroupsChart');
                 if(ctx) {
                    const cycleData = appData.cycle.length > 0 ? appData.cycle : initialData.cycle;
                    const filteredCycles = currentRegionFilter === 'All' ? cycleData : cycleData.filter(d => d.Region === currentRegionFilter);
                    const labels = [...new Set(filteredCycles.map(d => d.Cycle))].sort((a,b) => parseInt(a.replace("Cycle ", "")) - parseInt(b.replace("Cycle ", "")));
                    
                    let datasets;
                    if (currentRegionFilter === 'All') {
                         const regions = [...new Set(filteredCycles.map(d => d.Region))];
                         datasets = regions.map((r, i) => ({
                            label: r,
                            data: labels.map(c => filteredCycles.filter(d => d.Cycle === c && d.Region === r).reduce((acc, curr) => acc + (curr["Number of Activities"] || curr.No || 0), 0)),
                            backgroundColor: COLORS[i % COLORS.length]
                        }));
                    } else {
                        const activities = [...new Set(filteredCycles.map(d => d.Activity))];
                        datasets = activities.map((act, i) => ({
                            label: act,
                            data: labels.map(c => filteredCycles.filter(d => d.Cycle === c && d.Activity === act).reduce((acc, curr) => acc + (curr["Number of Activities"] || curr.No || 0), 0)),
                            backgroundColor: COLORS[i % COLORS.length]
                        }));
                    }
                    chartInstances.cycleGroups = new Chart(ctx, { type: 'bar', data: {labels, datasets}, options: {maintainAspectRatio: false, scales: {x:{stacked:true}, y:{stacked:true}}}});
                 }
             }
        }

                acc.activities += curr["Number of Activities"] || 0;
                acc.participants += curr["Total Participants"] || 0;
                acc.friends += curr["Friends of the Faith"] || 0;
                return acc;
            }, { activities: 0, participants: 0, friends: 0 });

            const filterTitle = currentRegionFilter === 'All' ? 'National Overview' : `${currentRegionFilter} Overview`;
            const tableData = appData.regional.length > 0 ? appData.regional : initialData.regional;

                    <h2 class="text-2xl font-bold text-gray-800 mb-2">${filterTitle}</h2>
                    <section class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        ${createStatCard('Total Activities', totals.activities.toLocaleString(), 'bg-sky-100 text-sky-600', '<svg class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a3.001 3.001 0 015.63 0m0 0a3.001 3.001 0 015.63 0M12 12v9m-4-6h8"/></svg>')}
                        ${createStatCard('Total Participants', totals.participants.toLocaleString(), 'bg-emerald-100 text-emerald-600', '<svg class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M15 21a6 6 0 00-9-5.197m9 5.197a6 6 0 00-3.75-5.493M15 21a6 6 0 00-9-5.197M9 11a4 4 0 100-8 4 4 0 000 8z" /></svg>')}
                        ${createStatCard('Friends of the Faith', totals.friends.toLocaleString(), 'bg-amber-100 text-amber-600', '<svg class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>')}
                    </section>
                    ${createTable(data, 'Key Metrics by Activity')}
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        <section class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                            <h3 class="font-semibold text-lg mb-6 text-gray-800">Activity Distribution</h3>
                            <div class="h-80"><canvas id="regionalBarChart"></canvas></div>
                        </section>
                        <section class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                            <h3 class="font-semibold text-lg mb-6 text-gray-800">Participant Share</h3>
                            <div class="h-80 flex justify-center"><canvas id="participantPieChart"></canvas></div>
                        </section>
                    </div>
                    ${createPivotedTable(tableData, 'Detailed Regional Breakdown', ["Devotional Meetings", "Children's Classes", "Junior Youth Groups", "Study Circles"], currentRegionFilter)}
                </div>`;
        }

        function renderYouthMovementPage() {
             const youthData = appData.youthMovement.total > 0 ? appData.youthMovement : initialData.youthMovement;
             const summaryCards = `
                <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                    ${createStatCard('Total Baháʼí Youth', youthData.total.toLocaleString(), 'bg-green-100 text-green-600', '<svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M15 21a6 6 0 00-9-5.197m9 5.197a6 6 0 00-3.75-5.493M15 21a6 6 0 00-9-5.197M9 11a4 4 0 100-8 4 4 0 000 8z" /></svg>')}
                    ${createStatCard('Engaged', youthData.uniqueEngaged.toLocaleString(), 'bg-teal-100 text-teal-600', '<svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M12 21v-1m0-16a9 9 0 110 18 9 9 0 010-18z"/></svg>')}
                    ${createStatCard('Unique Facilitators', youthData.uniqueFacilitators.toLocaleString(), 'bg-blue-100 text-blue-600', '<svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" /></svg>')}
                    <div class="stat-card bg-indigo-50 p-6 rounded-xl shadow-sm border border-indigo-100 flex flex-col justify-center items-center text-center">
                        <p class="text-sm font-medium text-indigo-500 uppercase">Engagement Rate</p>
                        <p class="text-3xl font-bold text-indigo-700 mt-1">${youthData.total > 0 ? Math.round((youthData.uniqueEngaged / youthData.total) * 100) : 0}%</p>
                        <p class="text-xs text-indigo-400 mt-1">of total youth</p>
                    </div>
                </section>
            `;

            return `
                <div class="space-y-6">
                    ${createLastUpdatedBanner()}
                    <div class="bg-yellow-50 border-l-4 border-yellow-400 p-4 rounded-r shadow-sm">
                        <p class="text-sm text-yellow-700"><strong>Note:</strong> The data is based on Baháʼí youth only and needs verification.</p>
                    </div>
                    ${summaryCards}
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <section class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                            <h3 class="font-semibold text-lg mb-6 text-gray-800">Areas of Service</h3>
                            <div class="h-80"><canvas id="youthPolarChart"></canvas></div>
                        </section>
                        <section class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                            <h3 class="font-semibold text-lg mb-6 text-gray-800">Key Statistics</h3>
                            <div class="space-y-4">
                                ${[
                                    {l: 'In Study Circles', v: youthData.inStudyCircles, c: 'bg-purple-100 text-purple-700'},
                                    {l: 'Teaching Children', v: youthData.teachingChildrensClasses, c: 'bg-yellow-100 text-yellow-700'},
                                    {l: 'Animating Junior Youth', v: youthData.animatingJuniorYouth, c: 'bg-pink-100 text-pink-700'},
                                    {l: 'Tutoring Study Circles', v: youthData.tutoringStudyCircle, c: 'bg-red-100 text-red-700'},
                                ].map(item => `
                                    <div class="flex items-center justify-between p-4 rounded-lg bg-gray-50 hover:bg-gray-100 transition-colors">
                                        <span class="font-medium text-gray-700">${item.l}</span>
                                        <span class="px-3 py-1 rounded-full text-sm font-bold ${item.c}">${item.v}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </section>
                    </div>
                </div>
            `;
        }

        function renderContent(tabName) {
            currentTab = tabName;
            renderTabs();
            
            // Date Visibility Logic
            const dateDisplay = document.getElementById('header-date');
            if (dateDisplay) {
                if (tabName === 'Main Dashboard') {
                    dateDisplay.textContent = 'Last updated: 10 March 2026';
                    dateDisplay.classList.remove('hidden');
                } else if (['Bi-Annual Survey', 'Pioneering'].includes(tabName)) {
                    dateDisplay.textContent = 'Last updated: November 2025';
                    dateDisplay.classList.remove('hidden');
                } else if (['Cycle Data', 'Youth Movement'].includes(tabName)) {
                    const todayStr = new Date().toLocaleDateString('en-AU', { day: 'numeric', month: 'long', year: 'numeric' });
                    dateDisplay.textContent = `Last updated: ${todayStr}`;
                    dateDisplay.classList.remove('hidden');
                } else {
                    dateDisplay.classList.add('hidden');
                }
            }
            
            if (regionFilterContainer) {
                if (tabName === 'Main Dashboard' || tabName === 'Cycle Data') {
                    regionFilterContainer.classList.remove('hidden');
                } else {
                    regionFilterContainer.classList.add('hidden');
                }
            }
            
            let html = '';
            if (tabName === 'Main Dashboard') html = renderMainDashboard();
            else if (tabName === 'Youth Movement') html = renderYouthMovementPage();
            else if (tabName === 'Bi-Annual Survey') {
                const surveyData = appData.survey.length > 0 ? appData.survey : initialData.survey;
                
                // Helper to sort dates chronologically (Mon-YY)
                const dateValue = (d) => {
                    const [mon, yr] = d.split('-');
                    const months = { 'Jan': 0, 'Feb': 1, 'Mar': 2, 'Apr': 3, 'May': 4, 'Jun': 5, 'Jul': 6, 'Aug': 7, 'Sep': 8, 'Oct': 9, 'Nov': 10, 'Dec': 11 };
                    return (parseInt(yr) + 2000) * 12 + months[mon];
                };

                const labels = [...new Set(surveyData.map(d => d.Date))].sort((a, b) => dateValue(a) - dateValue(b));
                const activities = [...new Set(surveyData.map(d => d.Activity))];

                html = `
                <div class="space-y-6">
                    ${createLastUpdatedBanner()}
                    <div class="grid grid-cols-1 gap-6">
                         <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100"><h3 class="font-semibold mb-4">Groups</h3><div class="h-80"><canvas id="surveyGroupsChart"></canvas></div></div>
                         <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100"><h3 class="font-semibold mb-4">Participants</h3><div class="h-80"><canvas id="surveyParticipantsChart"></canvas></div></div>
                         <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100"><h3 class="font-semibold mb-4">Friends of the Faith</h3><div class="h-80"><canvas id="surveyFofChart"></canvas></div></div>
                    </div>
                    <div class="bg-red-50 border-l-4 border-red-400 p-4 rounded-r mt-4">
                        <p class="text-sm text-red-700"><strong>Note:</strong> The drop in participation in Children's classes is a result of a change in the October 2025 Bi-annual survey where children's festivals were no longer reported as part of the regular Children's Classes and reported separately instead.</p>
                    </div>
                </div>`; 
            } else if (tabName === 'Pioneering') {
                 html = `
                 <div class="space-y-8">
                    ${createLastUpdatedBanner()}
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                         <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100"><h3 class="font-semibold mb-4 text-xl">International Pioneers</h3><div class="h-80"><canvas id="internationalPioneerTrendsChart"></canvas></div></div>
                         <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100"><h3 class="font-semibold mb-4 text-xl">Homefront Pioneers</h3><div class="h-80"><canvas id="homefrontPioneerTrendsChart"></canvas></div></div>
                    </div>
                 </div>`;
                 
                 const trendsData = appData.pioneeringTrends.length > 0 ? appData.pioneeringTrends : initialData.pioneeringTrends;
                 // Sort labels chronologically (Nov-Apr before May-Oct)
                 const labels = [...new Set(trendsData.map(d => d.Date))].sort((a, b) => {
                    const [rangeA, yearA] = a.split(' ');
                    const [rangeB, yearB] = b.split(' ');
                    const yA = parseInt(yearA) || 0;
                    const yB = parseInt(yearB) || 0;
                    
                    if (yA !== yB) return yA - yB;
                    // Assign values: Nov-Apr = 0, May-Oct = 1
                    const valA = rangeA.startsWith('Nov') ? 0 : 1;
                    const valB = rangeB.startsWith('Nov') ? 0 : 1;
                    return valA - valB;
                });
                 
                 const drawPioneerChart = (id, type) => {
                     const ctx = document.getElementById(id);
                     if(!ctx) return;
                     chartInstances[id] = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: labels,
                            datasets: [
                                { label: 'Male', data: labels.map(d => trendsData.filter(x => x.Date === d).reduce((a,b) => a + (b[`${type} Male`]||0), 0)), backgroundColor: '#3b82f6' },
                                { label: 'Female', data: labels.map(d => trendsData.filter(x => x.Date === d).reduce((a,b) => a + (b[`${type} Female`]||0), 0)), backgroundColor: '#ec4899' }
                            ]
                        },
                        options: { maintainAspectRatio: false, scales: { x: { stacked: true }, y: { stacked: true } } }
                     });
                 };

                 setTimeout(() => {
                    drawPioneerChart('internationalPioneerTrendsChart', "Int'l");
                    drawPioneerChart('homefrontPioneerTrendsChart', "Homefront");
                 }, 0);

            } else if (tabName === 'Cycle Data') {
                 html = `
                 <div class="space-y-6">
                    <div class="bg-yellow-50 border-l-4 border-yellow-400 p-4 mb-4"><p class="text-sm text-yellow-700"><strong>Note:</strong> The data may be incorrect and needs to be verified.</p></div>
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100"><h3 class="font-semibold mb-4">Activity Trends per Cycle (${currentRegionFilter === 'All' ? 'By Region' : 'By Activity'})</h3><div class="h-96"><canvas id="cycleGroupsChart"></canvas></div></div>
                    ${createTable((appData.cycle.length > 0 ? appData.cycle : initialData.cycle).filter(d => currentRegionFilter === 'All' || d.Region === currentRegionFilter), `Detailed Cycle Data (${currentRegionFilter})`)}
                 </div>`;
            } else if (tabName === 'Cluster Development') {
                 const clusterData = appData.cluster.length > 0 ? appData.cluster : initialData.cluster;
                 const getStatusColor = (s) => !s ? '' : s.includes('3rd') ? 'bg-green-100 text-green-800' : s.includes('2nd') ? 'bg-blue-100 text-blue-800' : 'bg-gray-100 text-gray-800';
                 const rows = clusterData.map(row => `
                    <tr class="hover:bg-gray-50 border-b border-gray-100">
                        <td class="px-6 py-4 text-sm font-medium text-gray-700">${row.Region} - ${row.Cluster}</td>
                        <td class="px-6 py-4 text-sm text-center"><span class="px-2 py-1 rounded-full text-xs font-semibold ${getStatusColor(row.R25F)}">${row.R25F}</span></td>
                        <td class="px-6 py-4 text-sm text-center"><span class="px-2 py-1 rounded-full text-xs font-semibold ${getStatusColor(row.R26F)}">${row.R26F}</span></td>
                    </tr>
                 `).join('');
                 
                 html = `
                 <div class="space-y-6">
                    ${createLastUpdatedBanner()}
                     <div class="bg-yellow-50 border-l-4 border-yellow-400 p-4 rounded-r">
                        <p class="text-sm text-yellow-700"><strong>Note:</strong> This page is still under development.</p>
                    </div>
                     <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                        <div class="px-6 py-4 border-b border-gray-100 bg-gray-50"><h3 class="font-semibold text-gray-800">Cluster Milestone Status</h3></div>
                        <div class="overflow-x-auto custom-scrollbar max-h-[600px]"><table class="min-w-full"><thead><tr><th class="px-6 py-3 text-left bg-gray-50 text-xs font-semibold text-gray-500 uppercase tracking-wider sticky top-0">Cluster</th><th class="px-6 py-3 bg-gray-50 text-center text-xs font-semibold text-gray-500 uppercase tracking-wider sticky top-0">Ridván 2025</th><th class="px-6 py-3 bg-gray-50 text-center text-xs font-semibold text-gray-500 uppercase tracking-wider sticky top-0">Ridván 2026</th></tr></thead><tbody>${rows}</tbody></table></div>
                     </div>
                 </div>`;
            }

            if (contentContainer) contentContainer.innerHTML = html;
            setTimeout(renderCharts, 50);
        }

        function refreshUIIfActive(tabName) {
            if (loader) loader.classList.add('hidden');
            if (dashboard) dashboard.classList.remove('hidden');
            if (appData.regional.length > 0 && regionSelect && regionSelect.options.length === 1) {
                populateRegionFilter();
            }
            if (currentTab === tabName || tabName === 'Main Dashboard') {
                renderContent(currentTab);
            }
        }

        function setupListeners() {
            if (!user || !db) return;
            // Updated regional_data_v9 to force a fresh seed with new image data
            const collections = ['regional_data_v9', 'survey_data', 'cluster_data', 'cycle_data_v3', 'pioneering_data'];
            const mapping = {
                'regional_data_v9': 'regional', 'survey_data': 'survey', 'cluster_data': 'cluster', 
                'cycle_data_v3': 'cycle', 'pioneering_data': 'pioneeringTrends'
            };
            const tabMapping = {
                'regional_data_v9': 'Main Dashboard', 'survey_data': 'Bi-Annual Survey', 
                'cluster_data': 'Cluster Development', 'cycle_data_v3': 'Cycle Data', 'pioneering_data': 'Pioneering'
            };

            collections.forEach(colName => {
                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', colName), (snap) => {
                    const data = snap.docs.map(d => d.data());
                    if (data.length > 0) {
                        appData[mapping[colName]] = data;
                        refreshUIIfActive(tabMapping[colName]);
                    }
                });
            });
            
            onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'youth_data', 'summary'), (snap) => {
                if (snap.exists()) {
                    appData.youthMovement = snap.data();
                    refreshUIIfActive('Youth Movement');
                }
            });
        }
        
        async function initAuth() {
            if (!auth) return;
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Auth Error:", error);
                if (loader) loader.classList.add('hidden');
                if (dashboard) dashboard.classList.remove('hidden');
            }
        };

        async function seedData() {
            if (!user || !db) return;
            try {
                // Check for v9 regional data (New Seed)
                const checkRef = collection(db, 'artifacts', appId, 'public', 'data', 'regional_data_v9');
                const snapshot = await getDocs(checkRef);
                
                const cycleCheckRef = collection(db, 'artifacts', appId, 'public', 'data', 'cycle_data_v3');
                const cycleSnapshot = await getDocs(cycleCheckRef);

                const upload = async (c, d) => { 
                    if (!d || !Array.isArray(d)) {
                        console.error(`Skipping ${c}: Data is not an array`, d);
                        return;
                    }
                    const ref = collection(db, 'artifacts', appId, 'public', 'data', c);
                    for(const i of d) await setDoc(doc(ref), i);
                };

                if (snapshot.empty) {
                    console.log("Seeding v9 data...");
                    await upload('regional_data_v9', initialData.regional);
                    
                    const surveyRef = collection(db, 'artifacts', appId, 'public', 'data', 'survey_data');
                    if((await getDocs(surveyRef)).empty) await upload('survey_data', initialData.survey);
                    
                    const clusterRef = collection(db, 'artifacts', appId, 'public', 'data', 'cluster_data');
                    if((await getDocs(clusterRef)).empty) await upload('cluster_data', initialData.cluster);
                    
                    if(cycleSnapshot.empty) await upload('cycle_data_v3', initialData.cycle);

                    const pioneerRef = collection(db, 'artifacts', appId, 'public', 'data', 'pioneering_data');
                    if((await getDocs(pioneerRef)).empty) await upload('pioneering_data', initialData.pioneeringTrends);
                    
                    if (initialData.youthMovement) {
                        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'youth_data', 'summary'), initialData.youthMovement);
                    }
                    console.log("Seeded.");
                } else if (cycleSnapshot.empty) {
                     await upload('cycle_data_v3', initialData.cycle);
                }
            } catch (e) { console.error(e); }
        }

        // --- 4. STARTUP SEQUENCE ---
        
        // 1. Grab DOM Elements (This works because type="module" defers execution)
        contentContainer = document.getElementById('content-container');
        regionSelect = document.getElementById('regionSelect');
        regionFilterContainer = document.getElementById('region-filter-container');
        loader = document.getElementById('loader');
        dashboard = document.getElementById('dashboard-container');
        
        // Set Header Date with "Last updated:" prefix
        const dateDisplay = document.getElementById('header-date');
        if (dateDisplay) {
            dateDisplay.textContent = `Last updated: 10 March 2026`;
        }
            
        // 2. Initial Render with Empty/Local Data to prevent blank screen
        populateRegionFilter();
        renderContent(currentTab);
        
        // 3. Failsafe
        setTimeout(() => {
            if (loader && !loader.classList.contains('hidden')) {
                loader.classList.add('hidden');
                dashboard.classList.remove('hidden');
            }
        }, 2000);

        // 4. Start Auth & Listeners
        if (auth) {
            initAuth().then(() => {
                // Auth initiated
            });
            
            onAuthStateChanged(auth, async (u) => {
                if (u) {
                    user = u;
                    await seedData();
                    setupListeners();
                }
            });
        } else {
            console.warn("Running in local mode. Firebase config not found.");
            if (loader) loader.classList.add('hidden');
            if (dashboard) dashboard.classList.remove('hidden');
        }

    </script>
</body>
</html>
